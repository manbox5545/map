<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Offline Navigator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
        }

        /* MAP */

        #map {
            width: 100%;
            height: 100%;
            background:
                linear-gradient(
                    135deg,
                    #dfe8d7,
                    #b8d0b0
                );
            position: relative;
            overflow: hidden;
        }

        /* FAKE ROAD NETWORK FOR TESTING */

        .road {
            position: absolute;

            background: #555;

            border: 3px solid #777;

            box-shadow:
                0 0 0 2px rgba(255,255,255,.25);

            transform-origin: center;
        }

        .road.horizontal {
            width: 100%;
            height: 55px;

            top: 50%;
            left: 0;

            transform:
                translateY(-50%);
        }

        .road.vertical {
            width: 55px;
            height: 100%;

            left: 50%;
            top: 0;

            transform:
                translateX(-50%);
        }

        .road.diagonal {
            width: 100%;
            height: 45px;

            left: 0;
            top: 50%;

            transform:
                translateY(-50%)
                rotate(25deg);
        }

        /* HEADER */

        #header {

            position: absolute;

            top: 15px;
            left: 15px;
            right: 15px;

            z-index: 10;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 14px 18px;

            border-radius: 16px;

            background:
                rgba(20,20,20,.9);

            color: white;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.3);
        }

        #title {
            font-size: 19px;
            font-weight: bold;
        }

        #status {
            font-size: 13px;
            color: #aaa;
        }

        #dot {

            display: inline-block;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #777;

            margin-right: 5px;
        }

        #dot.active {
            background: #00e676;

            box-shadow:
                0 0 10px #00e676;
        }

        /* INFO */

        #info {

            position: absolute;

            top: 85px;
            left: 15px;

            z-index: 10;

            width: 230px;

            padding: 15px;

            border-radius: 16px;

            background:
                rgba(20,20,20,.9);

            color: white;
        }

        .infoRow {

            display: flex;

            justify-content:
                space-between;

            margin-bottom: 10px;

            font-size: 13px;
        }

        .infoRow:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #aaa;
        }

        /* PLAYER */

        #player {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 28px;
            height: 28px;

            transform:
                translate(-50%,-50%);

            z-index: 8;

            border-radius: 50%;

            background: #1976d2;

            border: 4px solid white;

            box-shadow:
                0 0 0 9px
                rgba(25,118,210,.2),
                0 4px 12px
                rgba(0,0,0,.4);
        }

        #arrow {

            position: absolute;

            left: 50%;
            top: -22px;

            transform:
                translateX(-50%);

            width: 0;
            height: 0;

            border-left:
                8px solid transparent;

            border-right:
                8px solid transparent;

            border-bottom:
                20px solid #1976d2;
        }

        /* CONTROLS */

        #controls {

            position: absolute;

            right: 15px;
            bottom: 20px;

            z-index: 10;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        button {

            min-width: 55px;
            min-height: 52px;

            border: none;

            border-radius: 15px;

            background:
                rgba(20,20,20,.92);

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.3);
        }

        button:active {
            transform: scale(.95);
        }

        #start {
            background: #008f5a;
        }

        #stop {
            display: none;
            background: #c62828;
        }

        /* MESSAGE */

        #message {

            position: absolute;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            z-index: 20;

            padding: 12px 18px;

            background:
                rgba(20,20,20,.9);

            color: white;

            border-radius: 14px;

            font-size: 13px;

            text-align: center;
        }

    </style>

</head>


<body>


<!-- MAP -->

<div id="map">

    <!-- TEST ROADS -->

    <div class="road horizontal"></div>

    <div class="road vertical"></div>

    <div class="road diagonal"></div>


    <!-- PLAYER -->

    <div id="player">

        <div id="arrow"></div>

    </div>

</div>


<!-- HEADER -->

<div id="header">

    <div id="title">
        🗺️ Offline Navigator
    </div>

    <div id="status">

        <span id="dot"></span>

        <span id="statusText">
            GPS OFF
        </span>

    </div>

</div>


<!-- INFORMATION -->

<div id="info">

    <div class="infoRow">

        <span class="label">
            Speed
        </span>

        <span id="speed">
            0 km/h
        </span>

    </div>


    <div class="infoRow">

        <span class="label">
            Accuracy
        </span>

        <span id="accuracy">
            --
        </span>

    </div>


    <div class="infoRow">

        <span class="label">
            Distance
        </span>

        <span id="distance">
            0 m
        </span>

    </div>


    <div class="infoRow">

        <span class="label">
            Heading
        </span>

        <span id="heading">
            0°
        </span>

    </div>

</div>


<!-- CONTROLS -->

<div id="controls">

    <button id="locate">
        📍
    </button>

    <button id="start">
        ▶ Track
    </button>

    <button id="stop">
        ■ Stop
    </button>

</div>


<!-- MESSAGE -->

<div id="message">

    Click "Track" to start GPS.

</div>


<script>


/* =========================================================
   VARIABLES
========================================================= */

let gpsWatch = null;

let tracking = false;

let lastPosition = null;

let totalDistance = 0;

let currentHeading = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const player =
    document.getElementById(
        "player"
    );

const arrow =
    document.getElementById(
        "arrow"
    );

const startButton =
    document.getElementById(
        "start"
    );

const stopButton =
    document.getElementById(
        "stop"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const gpsDot =
    document.getElementById(
        "dot"
    );


/* =========================================================
   START GPS
========================================================= */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        alert(
            "Your browser does not support GPS."
        );

        return;

    }


    tracking = true;


    startButton.style.display =
        "none";


    stopButton.style.display =
        "block";


    gpsDot.classList.add(
        "active"
    );


    statusText.textContent =
        "GPS ACTIVE";


    document.getElementById(
        "message"
    ).textContent =
        "GPS tracking started.";


    gpsWatch =
        navigator.geolocation.watchPosition(

            updatePosition,

            gpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    1000,

                timeout:
                    15000

            }

        );

}


/* =========================================================
   STOP GPS
========================================================= */

function stopGPS() {

    tracking = false;


    if (
        gpsWatch !== null
    ) {

        navigator.geolocation.clearWatch(
            gpsWatch
        );

        gpsWatch = null;

    }


    startButton.style.display =
        "block";


    stopButton.style.display =
        "none";


    gpsDot.classList.remove(
        "active"
    );


    statusText.textContent =
        "GPS OFF";


    document.getElementById(
        "message"
    ).textContent =
        "GPS tracking stopped.";

}


/* =========================================================
   GPS UPDATE
========================================================= */

function updatePosition(
    position
) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;

    const speed =
        position.coords.speed || 0;


    /* DISTANCE */

    if (
        lastPosition
    ) {

        const distance =
            calculateDistance(

                lastPosition.latitude,

                lastPosition.longitude,

                latitude,

                longitude

            );


        if (
            distance > 1 &&
            distance < 100
        ) {

            totalDistance +=
                distance;

        }

    }


    /* HEADING */

    if (
        position.coords.heading !== null &&
        !isNaN(
            position.coords.heading
        )
    ) {

        currentHeading =
            position.coords.heading;

    }


    lastPosition = {

        latitude,
        longitude

    };


    /* UI */

    document.getElementById(
        "speed"
    ).textContent =

        (
            speed * 3.6
        ).toFixed(1)
        + " km/h";


    document.getElementById(
        "accuracy"
    ).textContent =

        Math.round(
            accuracy
        )
        + " m";


    document.getElementById(
        "distance"
    ).textContent =

        formatDistance(
            totalDistance
        );


    document.getElementById(
        "heading"
    ).textContent =

        Math.round(
            currentHeading
        )
        + "°";


    /* ROTATE ARROW */

    arrow.style.transform =

        `translateX(-50%)
         rotate(${currentHeading}deg)`;


    console.log(
        "GPS:",
        latitude,
        longitude
    );

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(
    error
) {

    console.error(
        error
    );


    statusText.textContent =
        "GPS ERROR";


    document.getElementById(
        "message"
    ).textContent =

        "GPS error: " +
        error.message;

}


/* =========================================================
   LOCATION BUTTON
========================================================= */

document.getElementById(
    "locate"
).onclick =

function() {

    if (
        !navigator.geolocation
    ) {

        alert(
            "GPS is not supported."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            console.log(
                position.coords
            );


            document.getElementById(
                "message"
            ).textContent =

                "Location found!";

        },

        gpsError,

        {

            enableHighAccuracy:
                true

        }

    );

};


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.onclick =
    startGPS;


stopButton.onclick =
    stopGPS;


/* =========================================================
   DISTANCE CALCULATION
========================================================= */

function calculateDistance(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const earthRadius =
        6371000;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            toRadians(lat1)
        )

        *

        Math.cos(
            toRadians(lat2)
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );


    return (
        earthRadius * c
    );

}


/* =========================================================
   DISTANCE FORMAT
========================================================= */

function formatDistance(
    meters
) {

    if (
        meters < 1000
    ) {

        return (
            Math.round(meters)
            + " m"
        );

    }


    return (

        (
            meters / 1000
        ).toFixed(2)

        + " km"

    );

}


/* =========================================================
   HELPERS
========================================================= */

function toRadians(
    degrees
) {

    return (

        degrees *
        Math.PI /
        180

    );

}


</script>

</body>

</html>
